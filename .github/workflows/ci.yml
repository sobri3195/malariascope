name: Validate
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            research/requirements.txt
            services/requirements.txt
            services/requirements-dev.txt
      - run: pip install -r research/requirements.txt -r services/requirements.txt -r services/requirements-dev.txt
      - run: npm run test:research
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Complete workspace browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --port 4173 > /tmp/malariascope-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/data/research-summary.json > /dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/risk-map > /dev/null
          export APP_URL=http://127.0.0.1:4173
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          npm run test:browser
          npm run test:accessibility
          npm run test:cross-browser
